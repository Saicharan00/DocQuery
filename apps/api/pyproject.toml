[project]
name = "docquery-api"
version = "0.1.0"
description = "DocQuery backend — multi-model RAG chat over user documents"
requires-python = ">=3.11"
dependencies = [
    "cohere>=7.0.8",
    "fastapi>=0.140.13",
    "httpx>=0.28.1",
    "langchain-text-splitters>=1.1.2",
    "litellm>=1.94.0",
    "pydantic-settings>=2.14.2",
    "pymupdf>=1.28.0",
    "python-docx>=1.2.0",
    "python-jose[cryptography]>=3.5.0",
    "python-multipart>=0.0.32",
    "supabase>=2.31.0",
    "tiktoken>=0.13.0",
    "uvicorn[standard]>=0.51.0",
]

[tool.uv]
package = false
